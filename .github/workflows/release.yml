name: Release

# Builds P-Vault.apk with the original signing key and publishes it as a GitHub release.
#
# Runs on every push to main and can be started by hand from the Actions page.
# It releases the version in app/build.gradle.kts, and does nothing if that version
# is already published. So: bump versionName/versionCode, merge to main, done.
#
# Needs one repository secret, DEBUG_KEYSTORE_BASE64: the base64 text of the
# debug.keystore that signed every earlier P Vault release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # SHA-256 of the certificate that signed 0.4.x and 0.5.0. An APK signed with anything
  # else cannot update an installed P Vault, so the job refuses to publish it.
  EXPECTED_CERT: 1a277362e81b93e195c162d11225435b19ffcf3635cfcb91bf550a09dcd5d4c3
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          test -n "$name"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          state=$(gh release view "v$name" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          # A version ending in -test (or -beta and the like) is published as a pre-release,
          # so it never becomes the "latest" release and no ordinary phone is offered it.
          case "$name" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version $name, existing: $state (false = published), pre-release: $prerelease"

      - name: Install signing key
        if: steps.version.outputs.state != 'false'
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The DEBUG_KEYSTORE_BASE64 secret is not set. Add it under Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
          # A neutral path, handed to Gradle as PV_KEYSTORE. It is deliberately not the
          # plugin's own ~/.android/debug.keystore, which the build server regenerates.
          target="$RUNNER_TEMP/pv-signing.keystore"
          echo "$KEYSTORE" | tr -d ' \r\n' | base64 -d > "$target"
          bytes=$(stat -c %s "$target")
          if [ "$bytes" -lt 1000 ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 decoded to only $bytes bytes, so it is not a keystore. Copy the whole file again."
            exit 1
          fi
          echo "PV_KEYSTORE=$target" >> "$GITHUB_ENV"
          echo "Keystore ready at $target ($bytes bytes)."

      - uses: actions/setup-java@v4
        if: steps.version.outputs.state != 'false'
        with:
          distribution: temurin
          java-version: 17

      # Checked before the build: a wrong key used to cost five minutes and then a
      # fingerprint error. Now it stops in seconds and names the problem.
      - name: Check the signing key
        if: steps.version.outputs.state != 'false'
        run: |
          store="$PV_KEYSTORE"
          actual=$(stat -c %s "$store" || echo 0)
          if [ "$actual" -lt 1000 ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 decoded to only $actual bytes, so it is not a keystore. Copy the whole file again."
            exit 1
          fi
          if ! keytool -list -v -keystore "$store" -storepass android > /tmp/key.txt 2>&1; then
            echo "::error::The secret decodes to a file Java cannot open as a keystore (password 'android'). Send the last lines of this log."
            tail -n 6 /tmp/key.txt
            exit 1
          fi
          found=$(grep -m1 'SHA256:' /tmp/key.txt | sed 's/.*SHA256: //; s/[[:space:]]*$//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Keystore certificate SHA-256: $found"
          if [ "$found" != "$EXPECTED_CERT" ]; then
            echo "::error::This keystore is not the one that signed the installed P Vault. Its fingerprint is $found, expected $EXPECTED_CERT. Replace DEBUG_KEYSTORE_BASE64 with the PC's debug.keystore."
            exit 1
          fi

      - name: Build and test
        if: steps.version.outputs.state != 'false'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease testReleaseUnitTest
          cp app/build/outputs/apk/release/app-release.apk P-Vault.apk

      # Belt and braces: if the APK somehow came out with another key, sign it here with
      # the keystore that was checked above, rather than publishing something that cannot
      # update an installed P Vault.
      - name: Make sure the APK carries the original key
        if: steps.version.outputs.state != 'false'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs P-Vault.apk | grep -oP 'certificate SHA-256 digest: \K[0-9a-f]+' | head -1)
          if [ "$actual" = "$EXPECTED_CERT" ]; then
            echo "Built and signed with the original key."
            exit 0
          fi
          echo "Built APK has $actual; re-signing with the checked keystore."
          zipalign=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          "$zipalign" -f 4 P-Vault.apk P-Vault-aligned.apk
          "$apksigner" sign --ks "$PV_KEYSTORE" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out P-Vault-resigned.apk P-Vault-aligned.apk
          mv P-Vault-resigned.apk P-Vault.apk

      - name: Check the APK is signed with the original key
        if: steps.version.outputs.state != 'false'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs P-Vault.apk | grep -oP 'certificate SHA-256 digest: \K[0-9a-f]+' | head -1)
          echo "APK certificate: $actual"
          if [ "$actual" != "$EXPECTED_CERT" ]; then
            echo "::error::Key fingerprint is $actual but must be $EXPECTED_CERT. This APK is not signed with the original P Vault key, so it could not update existing installs. Check that DEBUG_KEYSTORE_BASE64 holds the keystore from the PC that built earlier releases."
            exit 1
          fi

      - name: Publish
        if: steps.version.outputs.state != 'false'
        run: |
          tag=${{ steps.version.outputs.tag }}
          # A pre-release is never marked latest, so the app's update check (which reads
          # /releases/latest) does not offer it to anyone.
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            latest=""
            pre="--prerelease"
          else
            latest="--latest"
            pre=""
          fi
          if [ "${{ steps.version.outputs.state }}" = "true" ]; then
            gh release upload "$tag" P-Vault.apk --clobber
            gh release edit "$tag" --draft=false $latest $pre --target "$GITHUB_SHA"
          else
            gh release create "$tag" P-Vault.apk --title "P Vault ${{ steps.version.outputs.name }}" \
              --generate-notes $latest $pre --target "$GITHUB_SHA"
          fi
