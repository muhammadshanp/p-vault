name: Release

# Builds P-Vault.apk with the original signing key and publishes it as a GitHub release.
#
# Runs on every push to main and can be started by hand from the Actions page.
# It releases the version in app/build.gradle.kts, and does nothing if that version
# is already published. So: bump versionName/versionCode, merge to main, done.
#
# Needs one repository secret, DEBUG_KEYSTORE_BASE64: the base64 text of the
# debug.keystore that signed every earlier P Vault release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # SHA-256 of the certificate that signed 0.4.x and 0.5.0. An APK signed with anything
  # else cannot update an installed P Vault, so the job refuses to publish it.
  EXPECTED_CERT: 1a277362e81b93e195c162d11225435b19ffcf3635cfcb91bf550a09dcd5d4c3
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          test -n "$name"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          state=$(gh release view "v$name" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Version $name, existing release: $state (false = already published)"

      - name: Install signing key
        if: steps.version.outputs.state != 'false'
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The DEBUG_KEYSTORE_BASE64 secret is not set. Add it under Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE" | tr -d ' \r\n' | base64 -d > "$HOME/.android/debug.keystore"

      - uses: actions/setup-java@v4
        if: steps.version.outputs.state != 'false'
        with:
          distribution: temurin
          java-version: 17

      - name: Build and test
        if: steps.version.outputs.state != 'false'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
          cp app/build/outputs/apk/debug/app-debug.apk P-Vault.apk

      - name: Check the APK is signed with the original key
        if: steps.version.outputs.state != 'false'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs P-Vault.apk | grep -oP 'certificate SHA-256 digest: \K[0-9a-f]+' | head -1)
          echo "APK certificate: $actual"
          if [ "$actual" != "$EXPECTED_CERT" ]; then
            echo "::error::This APK is not signed with the original P Vault key, so it could not update existing installs. Check that DEBUG_KEYSTORE_BASE64 holds the keystore from the PC that built earlier releases."
            exit 1
          fi

      - name: Publish
        if: steps.version.outputs.state != 'false'
        run: |
          tag=${{ steps.version.outputs.tag }}
          if [ "${{ steps.version.outputs.state }}" = "true" ]; then
            gh release upload "$tag" P-Vault.apk --clobber
            gh release edit "$tag" --draft=false --latest --target "$GITHUB_SHA"
          else
            gh release create "$tag" P-Vault.apk --title "P Vault ${{ steps.version.outputs.name }}" \
              --generate-notes --latest --target "$GITHUB_SHA"
          fi
