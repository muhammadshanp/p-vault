name: Build check

# Compiles the app and runs the unit tests. The APK it uploads is signed with a throwaway
# debug key, so it is for testing only and cannot be installed over a released P Vault.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon assembleRelease testReleaseUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: test-apk-not-for-release
          path: app/build/outputs/apk/release/app-release.apk
