name: Key check

# Answers one question in about a minute: is DEBUG_KEYSTORE_BASE64 the keystore that
# signed the earlier P Vault releases? It publishes nothing and builds nothing.
#
# Runs by itself whenever this file changes, and by hand from the Actions page.
on:
  push:
    paths: ['.github/workflows/key-check.yml']
  workflow_dispatch:

permissions: {}

env:
  # SHA-256 of the certificate on every P Vault release up to 0.5.16.
  EXPECTED_CERT: 1a277362e81b93e195c162d11225435b19ffcf3635cfcb91bf550a09dcd5d4c3

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Decode the secret
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not set at all. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          if ! echo "$KEYSTORE" | tr -d ' \r\n' | base64 -d > "$HOME/.android/debug.keystore" 2>/dev/null; then
            echo "::error::The secret is not valid base64, so it is not a copied keystore file. Copy the whole file again."
            exit 1
          fi
          bytes=$(stat -c %s "$HOME/.android/debug.keystore")
          echo "The secret decodes to $bytes bytes."
          if [ "$bytes" -lt 1000 ]; then
            echo "::error::Only $bytes bytes decoded, so this is not a keystore file. Copy the whole file again."
            exit 1
          fi
          echo "::notice::The secret decodes to $bytes bytes, which looks like a keystore. Reading it next."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read the certificate
        run: |
          store="$HOME/.android/debug.keystore"
          if ! keytool -list -v -keystore "$store" -storepass android > /tmp/key.txt 2>&1; then
            echo "::error::The file decodes but Java cannot open it as a keystore with the password 'android'. It is not the keystore from the PC."
            tail -n 6 /tmp/key.txt
            exit 1
          fi
          echo "Aliases in the keystore:"
          grep -E '^[A-Za-z].*,.*,.*' /tmp/key.txt || true
          found=$(grep -m1 'SHA256:' /tmp/key.txt | sed 's/.*SHA256: //; s/[[:space:]]*$//' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$found" ]; then
            echo "::error::The keystore has no certificate in it. It is empty or broken."
            exit 1
          fi
          echo "Keystore certificate SHA-256: $found"
          echo "Expected (the key that signed 0.5.14 to 0.5.16): $EXPECTED_CERT"
          if [ "$found" = "$EXPECTED_CERT" ]; then
            echo "::notice::MATCH. This secret is the right key; the Release workflow can sign and publish."
          else
            echo "::error::MISMATCH. This keystore is readable but it is NOT the key that signed the installed app. Its fingerprint is $found, expected $EXPECTED_CERT. Replace the secret with the PC's %USERPROFILE%\.android\debug.keystore."
          fi
